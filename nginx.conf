server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name easeland.in www.easeland.in localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Force no-cache on index.html so browsers and CDNs always load the latest build
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Proxy 2FA OTP dispatch directly to Stalwart MailServer JMAP API
    location /api/send-2fa-otp {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain';
            return 204;
        }

        proxy_pass https://mail.easeland.in/jmap/;
        proxy_ssl_server_name on;
        proxy_set_header Host mail.easeland.in;
        proxy_set_header Authorization "Basic YWRtaW5AZWFzZWxhbmQuaW46SlR4N2dncTNNQnpkb3BTRw==";
        proxy_set_header Content-Type "application/json";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Coolify / load balancer
    location /health {
        access_log off;
        return 200 'healthy';
        add_header Content-Type text/plain;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
