<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — EaseLand</title>
  <link rel="icon" type="image/png" href="/icons/icon-96x96.png" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
      max-width: 480px;
      width: 100%;
      padding: 40px 32px;
      text-align: center;
    }
    .logo-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .logo-img {
      height: 42px;
      width: auto;
    }
    .logo-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0F172A;
    }
    .logo-accent {
      color: #F59E0B;
    }
    .icon-bubble {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #FEF3C7;
      color: #D97706;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.15);
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.15);
      }
      50% {
        box-shadow: 0 0 0 16px rgba(245, 158, 11, 0.05);
      }
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #64748B;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-primary {
      background: #0F172A;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary:hover {
      background: #1E293B;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: #F1F5F9;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
      text-decoration: none;
    }
    .btn-secondary:hover {
      background: #E2E8F0;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFFBEB;
      border: 1px solid #FDE68A;
      color: #92400E;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-top: 24px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #F59E0B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="/icons/icon-96x96.png" alt="EaseLand Emblem" class="logo-img" />
      <div class="logo-text">Ease<span class="logo-accent">Land</span></div>
    </div>

    <div class="icon-bubble">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>You are currently offline</h1>
    <p>
      EaseLand could not reach the internet. Any properties, pages, or search results you've previously opened are still cached on your device.
    </p>

    <div class="actions">
      <button onclick="handleRetry()" id="retryBtn" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Retry Connection
      </button>
      <a href="/" class="btn-secondary">Go to Home Screen</a>
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      <span>PWA Offline Mode Active</span>
    </div>
  </div>

  <script>
    function handleRetry() {
      const btn = document.getElementById('retryBtn');
      btn.innerHTML = 'Checking...';
      btn.style.opacity = '0.7';
      if (navigator.onLine) {
        window.location.reload();
      } else {
        setTimeout(() => {
          btn.innerHTML = 'Still offline — Retry';
          btn.style.opacity = '1';
        }, 800);
      }
    }
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
